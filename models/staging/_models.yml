version: 2

models:
  - name: stg_customers
    description: One row per customer, with light renaming applied.
    columns:
      - name: customer_id
        description: Primary key for the customer.
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order, with light renaming applied.
    columns:
      - name: order_id
        description: Primary key for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to stg_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        description: Lifecycle status of the order.
        data_tests:
          - accepted_values:
              values: ['placed', 'completed', 'returned']
